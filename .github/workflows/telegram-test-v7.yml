name: Telegram Manual Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Telegram configuration and send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()

          if not token or not chat_id:
              print("FAILED: Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository Actions secrets.")
              sys.exit(1)

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          message = (
              "✅ Telegram test successful!\n"
              "Your Binance Early-Pump Scanner V7 can reach this chat.\n"
              "This was a manual connection test; no trading signal was generated."
          )
          try:
              response = requests.post(url, json={"chat_id": chat_id, "text": message}, timeout=15)
              data = response.json()
          except Exception as exc:
              print(f"FAILED: Could not contact Telegram ({type(exc).__name__}).")
              sys.exit(1)

          if response.ok and data.get("ok") is True:
              print("SUCCESS: Telegram accepted the test message.")
          else:
              print("FAILED: Telegram rejected the message.")
              print("Telegram response:", data.get("description", "No error description"))
              sys.exit(1)
          PY
