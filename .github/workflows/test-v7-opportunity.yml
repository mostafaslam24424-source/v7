name: V7 opportunity paper tests

on:
  pull_request:
    branches: [main]
    paths:
      - "binance_early_pump_v7.py"
      - "trade_profile_v7.py"
      - "test_trade_profile_v7.py"
      - ".github/workflows/test-v7-opportunity.yml"
  push:
    branches: ["feat/v7-opportunity-types-paper-plan"]
    paths:
      - "binance_early_pump_v7.py"
      - "trade_profile_v7.py"
      - "test_trade_profile_v7.py"
      - ".github/workflows/test-v7-opportunity.yml"

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip requests pandas
      - name: Compile scanner and opportunity module
        run: python -m py_compile binance_early_pump_v7.py trade_profile_v7.py
      - name: Run opportunity classification tests
        run: python -m unittest -v test_trade_profile_v7.py
